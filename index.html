<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Owlbear Rodeo - RPG Char Sheet</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="sheet" class="sheet">
    <div class="top">
      <div class="field-row">
        <label class="field">
          <span>Name</span>
          <input id="charName" type="text" maxlength="64" />
        </label>
        <label class="field">
          <span>Species</span>
          <input id="charSpecies" type="text" maxlength="64" />
        </label>
      </div>

      <div class="field-row compact">
        <label class="field small">
          <span>Rank</span>
          <select id="rankSelect"></select>
        </label>
        <label class="field small">
          <span>HP</span>
          <input id="hp" type="number" inputmode="numeric" step="1" />
        </label>
        <label class="field small">
          <span>SP</span>
          <input id="sp" type="number" inputmode="numeric" step="1" />
        </label>
      </div>

      <div class="meta">
        <div class="meta-line">
          <span>Rank limit:</span>
          <span id="rankLimitValue" class="mono">—</span>
        </div>
        <div class="meta-line">
          <span>Param cap (1.5×):</span>
          <span id="paramCapValue" class="mono">—</span>
        </div>

        <button id="openLogBtn" class="btn ghost" type="button">
          Open Roll Log
        </button>
      </div>
    </div>

    <div class="params-grid">
      <div class="col">
        <div class="group-title">Melee..</div>

        <!-- Group of 5 (left) -->
        <div id="paramsLeft"></div>
      </div>

      <div class="col">
        <div class="group-title">Tech..</div>

        <!-- Group of 5 (right) -->
        <div id="paramsRight"></div>
      </div>
    </div>
  </div>

  <div id="logWindow" class="log-window hidden" aria-hidden="true">
    <div class="log-header">
      <div class="log-title">Roll Log</div>
      <button id="closeLogBtn" class="btn ghost" type="button">Close</button>
    </div>
    <div id="logList" class="log-list"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
